{% extends "base.html" %}
{% block title %}Contact Us{% endblock %}

{% block content %}

<h1>Contact Us</h1>

<form method="post" class="p-3 border rounded">
    <div class="mb-4">
        <label for="name" class="form-label fw-semibold">Name</label>
        <input type="text" name="name" id="name" class="form-control form-control-lg" placeholder="Enter your name"
            value="{{ name }}">
    </div>

    <div class="mb-4">
        <label for="email" class="form-label fw-semibold">Email</label>
        <input type="text" name="email" id="email" class="form-control form-control-lg" placeholder="Enter your email"
            value="{{ email }}">
    </div>

    <div class="mb-4">
        <label for="message" class="form-label fw-semibold">Message</label>
        <textarea name="message" id="message" class="form-control form-control-lg" placeholder="Type your message here"
            rows="6">{{ message }}
</textarea>
    </div>

    {% if errors %}
    <div class="alert alert-danger">
        <ul class="mb-0 mt-2">
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}


    <button type="submit" class="btn btn-danger btn-lg px-5 fw-semibold">Send Message</button>
</form>
{% endblock %}

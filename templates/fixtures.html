{% extends "base.html" %}

{% block content %}
<h1 class="page-heading">Fixtures</h1>
{% for fixture in fixtures %}
<div class="fixtures">
    <h2 class="opponent">Manchester United vs {{ fixture.opponent }}</h2>
    <p class="date">{{ fixture.date }}</p>
    <p class="time">{{ fixture.stadium}}</p>
    {% if fixture.stadium == "Old Trafford" %}
    <p class="home-game">Home game</p>
    {% else %}
    <p class="away-game"> Away game</p>
    {% endif %}
</div>
{% endfor %}
{% endblock %}
